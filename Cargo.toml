[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

[package]
name = "ots-rs"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "ots"
path = "src/main.rs"

[dependencies]
ots-dsl = { path = "crates/ots-dsl" }
ots-forms = { path = "crates/ots-forms" }
ots-core = { path = "crates/ots-core" }
ots-render = { path = "crates/ots-render" }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
