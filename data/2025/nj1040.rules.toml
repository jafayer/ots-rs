kind = "sum"
args = ["L67", "L78"]

[[rules]]
id = "rule_overpay_L68"
target = "L68"
kind = "sub"
args = ["L66", "L54"]

[[rules]]
id = "rule_overpay_L80"
target = "L80"
kind = "sub"
args = ["L68", "L78"]

# -----------------------------
# Validations
# -----------------------------

[[validations]]
id = "validate_status"
kind = "enum"
field = "status"
enum_ref = "status"
severity = "error"

[[validations]]
id = "validate_homeowner_tenant"
kind = "warning_if"
condition = "HomeOwner and Tenant"
message = "Both HomeOwner and Tenant are checked"

[[validations]]
id = "validate_nonnegative_taxable_income"
kind = "nonnegative"
field = "L39"
severity = "error"

[execution]
strategy = "dag"
trace = true
emit_intermediate = true

